services:
  cryptstats:
    build: .
    image: cryptstats:1.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Hinter einem HTTPS-Proxy (Caddy, nginx, Traefik) auf "true" setzen.
      COOKIE_SECURE: "false"
    volumes:
      - cryptstats-data:/data

volumes:
  cryptstats-data:
